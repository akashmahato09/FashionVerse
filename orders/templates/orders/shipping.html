{% extends 'base.html' %} {% load static %} {% block css %}
<link rel="stylesheet" href="{% static 'css/shipping.css' %}" />
{% endblock %} {% block content %}

<div class="checkout-container">
  <div class="checkout-header">
    <h2>Checkout</h2>
    <p>Complete your shipping details to place your order.</p>
  </div>

  <form action="" method="POST">
    {% csrf_token %}

    <div class="checkout-grid">
      <!-- Customer Details -->

      <div class="checkout-card">
        <h3>Customer Details</h3>

        <div class="form-group">
          <label>Full Name</label>
          <input
            type="text"
            name="full_name"
            placeholder="Enter your full name"
            required
          />
        </div>

        <div class="form-group">
          <label>Phone Number</label>
          <input
            type="tel"
            name="phone_number"
            placeholder="9876543210"
            required
          />
        </div>

        <div class="form-group">
          <label>Email</label>
          <input
            type="email"
            name="email"
            placeholder="example@gmail.com"
            required
          />
        </div>
      </div>

      <!-- Shipping Address -->

      <div class="checkout-card">
        <h3>Shipping Address</h3>

        <div class="form-group">
          <label>Address Line 1</label>
          <input
            type="text"
            name="address_line_1"
            placeholder="House No, Street"
            required
          />
        </div>

        <div class="form-group">
          <label>Address Line 2</label>
          <input
            type="text"
            name="address_line_2"
            placeholder="Apartment, Area"
          />
        </div>

        <div class="form-group">
          <label>Landmark</label>
          <input
            type="text"
            name="landmark"
            placeholder="Near Temple / School"
          />
        </div>

        <div class="row">
          <div class="form-group">
            <label>City</label>
            <input type="text" name="city" required />
          </div>

          <div class="form-group">
            <label>District</label>
            <input type="text" name="district" required />
          </div>
        </div>

        <div class="row">
          <div class="form-group">
            <label>State</label>
            <input type="text" name="state" required />
          </div>

          <div class="form-group">
            <label>Pincode</label>
            <input type="text" name="pincode" maxlength="6" required />
          </div>
        </div>

        <div class="form-group">
          <label>Country</label>
          <input type="text" name="country" value="India" />
        </div>
      </div>

      <!-- Order Details -->

      <div class="checkout-card">
        <h3>Order Details</h3>

        <div class="form-group">
          <label>Quantity</label>

          <input
            type="number"
            id="quantity"
            name="quantity"
            value="1"
            min="1"
            max="{{ product.quantity }}"
          />
        </div>

        <div class="form-group">
          <label>Total Price</label>

          <input
            type="text"
            id="total_price"
            name="total_price"
            value="{{ product.selling_price }}"
            readonly
          />
        </div>
        <div class="form-group">
          <label>Order Status</label>

          <select name="order_status">
            <option value="Pending">Pending</option>
          </select>
        </div>
      </div>
    </div>

    <div class="checkout-btn">
      <button type="submit">Place Order</button>
    </div>
  </form>
</div>

<script>

const quantity = document.getElementById("quantity");

const totalPrice = document.getElementById("total_price");

const price = {{ product.selling_price }};

quantity.addEventListener("input", function(){

    let qty = parseInt(this.value);

    if(isNaN(qty) || qty < 1){
        qty = 1;
        this.value = 1;
    }

    totalPrice.value = qty * price;

});

</script>

{% endblock %}
