

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vendor Login | FashionVerse</title>

    {%load  static  %}
    {%block css %}<link rel="stylesheet" href="{% static 'css/login.css' %}"/>{% endblock css %} 

    <!-- Font Awesome -->
    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

     <!--- bootstrap link-->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65"
      crossorigin="anonymous"
    />
</head>
<body>

<div class="login-container">

    <!-- Left Side -->
    <div class="login-left">

        <h1>Fashion<span>Verse</span></h1>

        <h2>Vendor Login</h2>

        <p>
            Login to manage your products, orders, customers,
            and grow your business.
        </p>

    </div>

    <!-- Right Side -->
    <div class="login-right">

        <form method="POST">

            <!-- Django -->
            {% csrf_token %}

            <h2>Welcome Back</h2>

            <!-- Email -->
            <div class="input-box">
                <i class="fa-solid fa-at"></i>
                <input
                    type="email"
                    name="email"
                    placeholder="Email Address"
                    required>
            </div>

            <!-- Password -->
            <div class="input-box">
               <i class="fa-solid fa-key"></i>
                <input
                    type="password"
                    name="password"
                    placeholder="Password"
                    required>
            </div>

            <!-- Options -->
            <div class="login-options">

                <label>
                    <input type="checkbox">
                    Remember Me
                </label>

                <a href="#">Forgot Password?</a>

            </div>

            <button type="submit">
                Login
             
            </button>

            <p class="signup-text">
                Don't have a vendor account?

                <a href="{% url 'vendors:register' %}">
                    Register
                </a>
            </p>

        </form>

    </div>

</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
