{% extends 'vendor_base.html' %} 
{% block title%}{% endblock %} 
{% load static%} 
{%block css %}
<link rel="stylesheet" href="{% static 'css/edit_product.css' %}"/>{% endblock css %} {% block main_content %}

<div class="container mt-5 mb-5">

    <div class="card shadow-lg border-0">

        <div class="card-header bg-dark text-white">
            <h3 class="mb-0">
                <i class="fa-solid fa-pen-to-square"></i>
                Edit Product
            </h3>
        </div>

        <div class="card-body">

            <form method="POST" enctype="multipart/form-data">

                {% csrf_token %}

                <div class="row">

                    <!-- Product Name -->
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Product Name</label>

                        <input
                            type="text"
                            name="product_name"
                            class="form-control"
                            value="{{ product.product_name }}"
                            required
                        >
                    </div>

                    <!-- Brand -->
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Brand</label>

                        <input
                            type="text"
                            name="brand"
                            class="form-control"
                            value="{{ product.brand }}"
                        >
                    </div>

                    <!-- Category -->
                    <div class="col-md-6 mb-3">

                        <label class="form-label">Category</label>

                        <select name="category" class="form-select" required>

                            {% for category in categories %}

                            <option
                                value="{{ category.id }}"
                                {% if category.id == product.category.id %}selected{% endif %}
                            >
                                {{ category.category_name }}
                            </option>

                            {% endfor %}

                        </select>

                    </div>

                    <!-- Quantity -->
                    <div class="col-md-6 mb-3">

                        <label class="form-label">Quantity</label>

                        <input
                            type="number"
                            name="quantity"
                            class="form-control"
                            value="{{ product.quantity }}"
                            required
                        >

                    </div>

                    <!-- Original Price -->
                    <div class="col-md-6 mb-3">

                        <label class="form-label">Original Price</label>

                        <input
                            type="number"
                            step="0.01"
                            name="original_price"
                            class="form-control"
                            value="{{ product.original_price }}"
                            required
                        >

                    </div>

                    <!-- Selling Price -->
                    <div class="col-md-6 mb-3">

                        <label class="form-label">Selling Price</label>

                        <input
                            type="number"
                            step="0.01"
                            name="selling_price"
                            class="form-control"
                            value="{{ product.selling_price }}"
                            required
                        >

                    </div>

                    <!-- Stock -->
                    <div class="col-md-6 mb-3">

                        <label class="form-label">Stock Status</label>

                        <select name="stock_status" class="form-select">

                            <option value="In Stock"
                                {% if product.stock_status == "In Stock" %}selected{% endif %}>
                                In Stock
                            </option>

                            <option value="Out of Stock"
                                {% if product.stock_status == "Out of Stock" %}selected{% endif %}>
                                Out of Stock
                            </option>

                        </select>

                    </div>

                    <!-- Size -->
                    <div class="col-md-3 mb-3">

                        <label class="form-label">Size</label>

                        <select name="size" class="form-select">

                            <option value="">Select</option>

                            <option value="XS" {% if product.size == "XS" %}selected{% endif %}>XS</option>
                            <option value="S" {% if product.size == "S" %}selected{% endif %}>S</option>
                            <option value="M" {% if product.size == "M" %}selected{% endif %}>M</option>
                            <option value="L" {% if product.size == "L" %}selected{% endif %}>L</option>
                            <option value="XL" {% if product.size == "XL" %}selected{% endif %}>XL</option>
                            <option value="XXL" {% if product.size == "XXL" %}selected{% endif %}>XXL</option>

                        </select>

                    </div>

                    <!-- Color -->
                    <div class="col-md-3 mb-3">

                        <label class="form-label">Color</label>

                        <select name="color" class="form-select">

                            <option value="">Select</option>

                            <option value="Black" {% if product.color == "Black" %}selected{% endif %}>Black</option>
                            <option value="White" {% if product.color == "White" %}selected{% endif %}>White</option>
                            <option value="Blue" {% if product.color == "Blue" %}selected{% endif %}>Blue</option>
                            <option value="Red" {% if product.color == "Red" %}selected{% endif %}>Red</option>
                            <option value="Green" {% if product.color == "Green" %}selected{% endif %}>Green</option>
                            <option value="Yellow" {% if product.color == "Yellow" %}selected{% endif %}>Yellow</option>
                            <option value="Pink" {% if product.color == "Pink" %}selected{% endif %}>Pink</option>
                            <option value="Grey" {% if product.color == "Grey" %}selected{% endif %}>Grey</option>

                        </select>

                    </div>

                    <!-- Description -->
                    <div class="col-12 mb-3">

                        <label class="form-label">Description</label>

                        <textarea
                            name="description"
                            rows="5"
                            class="form-control"
                            required
                        >{{ product.description }}</textarea>

                    </div>

                    <!-- Current Image -->
                    <div class="col-md-6 mb-3">

                        <label class="form-label">Current Image</label>

                        <br>

                        {% if product.product_image %}

                            <img
                                src="{{ product.product_image.url }}"
                                class="img-thumbnail"
                                width="180"
                            >

                        {% else %}

                            <p class="text-muted">
                                No Image Available
                            </p>

                        {% endif %}

                    </div>

                    <!-- Upload New Image -->
                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Upload New Image
                        </label>

                        <input
                            type="file"
                            name="product_image"
                            class="form-control"
                        >

                    </div>

                    <!-- Featured -->
                    <div class="col-md-6 mb-3">

                        <div class="form-check">

                            <input
                                class="form-check-input"
                                type="checkbox"
                                name="is_featured"
                                id="featured"
                                {% if product.is_featured %}checked{% endif %}
                            >

                            <label class="form-check-label" for="featured">

                                Featured Product

                            </label>

                        </div>

                    </div>

                    <!-- Active -->
                    <div class="col-md-6 mb-3">

                        <div class="form-check">

                            <input
                                class="form-check-input"
                                type="checkbox"
                                name="is_active"
                                id="active"
                                {% if product.is_active %}checked{% endif %}
                            >

                            <label class="form-check-label" for="active">

                                Active Product

                            </label>

                        </div>

                    </div>

                </div>

                <div class="text-end mt-4">

                    <a href="{% url 'vendors:products' %}"
                       class="btn btn-secondary">

                        <i class="fa-solid fa-arrow-left"></i>
                        Back

                    </a>

                    <button
                        type="submit"
                        class="btn btn-success"
                    >

                        <i class="fa-solid fa-floppy-disk"></i>

                        Update Product

                    </button>

                </div>

            </form>

        </div>

    </div>

</div>
{% endblock main_content %}
