{% extends 'vendor_base.html' %} 
{% block title%}{% endblock %} 
{% load static%} 
{%block css %}
<link rel="stylesheet" href="{% static 'css/add_products.css' %}"/>{% endblock css %} {% block main_content %}

<div class="add-product-container">
  <!-- Page Header -->
  <div class="page-header">
    <div>
      <h2>Add New Product</h2>
      <p>Fill in the details below to add a new product.</p>
    </div>

    <a href="{% url 'vendors:products' %}" class="back-btn">
      <i class="fa-solid fa-arrow-left"></i>
      Back to Products
    </a>
  </div>

  <form action="{% url 'vendors:add_product' %}" method="POST" enctype="multipart/form-data">
    {% csrf_token %}
    <div class="form-grid">
      <!-- Product Name -->
      <div class="form-group">
        <label>Product Name</label>
        <input
          type="text"
          name="productName"
          placeholder="Enter product name"
        />
      </div>

      <!-- Category -->
      <div class="form-group">
        <label>Category</label>

        <select>
          {% if category %}
          <option value="category">{{category}}</option>
          {% else %}
          <option>-</option>
          {% endif %}
        </select>
      </div>

      <!-- Brand -->
      <div class="form-group">
        <label>Brand</label>
        <input type="text" name="brand" placeholder="Enter brand" />
      </div>

      <!-- SKU -->
      <div class="form-group">
        <label>Product Discription</label>
        <textarea
          type="text"
          name="Product_disc"
          placeholder="Product"
        ></textarea>
      </div>

      <!-- Price -->
      <div class="form-group">
        <label>Original Price</label>
        <input
          type="number"
          name="original_price"
          placeholder="₹ Original Price"
        />
      </div>

      <!-- Discount Price -->
      <div class="form-group">
        <label>Discount Price</label>
        <input
          type="number"
          name="selling_price"
          placeholder="₹ Discount Price"
        />
      </div>

      <!-- Stock -->
      <div class="form-group">
        <label>Stock Quantity</label>
        <input
          type="number"
          name="product_quantity"
          placeholder="Available Stock"
        />
      </div>

      <div class="form-group">
        <label>Stock Quantity</label>
        <select name="stock_status">
          <option value="In Stock">In Stock</option>
          <option value="Out of Stock">Out of Stock</option>
        </select>
      </div>

      <!-- Color -->
      <div class="form-group">
        <label>Color</label>
        <select name="color">
          <option value="">Select Color</option>
          <option value="Black">Black</option>
          <option value="White">White</option>
          <option value="Blue">Blue</option>
          <option value="Red">Red</option>
          <option value="Green">Green</option>
          <option value="Yellow">Yellow</option>
          <option value="Pink">Pink</option>
          <option value="Grey">Grey</option>
        </select>
      </div>

      <!-- Size -->
      <div class="form-group">
        <label>Available Sizes</label>
        <select name="size">
          <option value="">Select Size</option>
          <option value="XS">XS</option>
          <option value="S">S</option>
          <option value="M">M</option>
          <option value="L">L</option>
          <option value="XL">XL</option>
          <option value="XXL">XXL</option>
        </select>
      </div>

      <!-- Product Image -->
      <div class="form-group">
        <label>Product Image</label>
        <input type="file" name="product_image"  />
      </div>
       
      <div class="form-group">
        <label>Product Feature</label>
        <select name="is_feature">
          <option value=""></option>
          <option value="True">True</option>
          <option value="False">False</option>
        </select>
      </div>
      <div class="form-group">
        <label>Is Active</label>
        <select name="is_active">
          <option value=""></option>
          <option value="True">True</option>
          <option value="False">False</option>
        </select>
      </div>
       
    </div>

     
    <!-- Buttons -->

    <div class="btn-group">
      <button type="reset" class="cancel-btn">Cancel</button>

      <button type="submit" class="save-btn">Save Product</button>
    </div>
  </form>
</div>

{% endblock %}
