

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vendor Registration | FashionVerse</title>
    {%load  static  %}
    {%block css %}<link rel="stylesheet" href="{% static 'css/register.css' %}"/>{% endblock css %} 

    <!-- Font Awesome -->
    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

     <!--- bootstrap link-->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65"
      crossorigin="anonymous"
    />
</head>
<body>

<div class="register-container">

    <!-- Left Section -->
    <div class="register-left">

        <h1>Fashion<span>Verse</span></h1>

        <h2>Become a Vendor</h2>

        <p>
            Join thousands of sellers on FashionVerse and
            grow your online business with powerful tools,
            secure payments, and nationwide delivery.
        </p>

    </div>

    <!-- Right Section -->

    <div class="register-right">

        <form method="POST" enctype="multipart/form-data">

            {% csrf_token %}

            <h2>Create Vendor Account</h2>

            <!-- Store Name -->
            <div class="input-box">
                <i class="fa-solid fa-user"></i>
                <input
                    type="text"
                    name="vendor_name"
                    placeholder="username"
                    required>
            </div>

            <!-- Email -->
            <div class="input-box">
               <i class="fa-solid fa-at"></i>
                <input
                    type="email"
                    name="email"
                    placeholder="Email Address"
                    required>
            </div>

            <!-- Mobile -->
            <div class="input-box">
                <i class="fa-solid fa-phone"></i>
                <input
                    type="tel"
                    name="mobile"
                    placeholder="Mobile Number"
                    required>
            </div>

            <!-- Password -->
            <div class="input-box">
                <i class="fa-solid fa-lock"></i>
                <input
                    type="password"
                    name="password"
                    placeholder="Password"
                    required>
            </div>

            <!-- Confirm Password -->
            <div class="input-box">
                <i class="fa-solid fa-lock"></i>
                <input
                    type="password"
                    name="confirm_password"
                    placeholder="Confirm Password"
                    required>
            </div>

            <!-- upload images -->
            <div class="upload-box">
                <label>upload Your Image</label>
                <input
                    type="file"
                    name="vendorProfile">
            </div>

            <!-- Terms -->
            <div class="terms">

                <label>
                    <input type="checkbox" required>
                    I agree to the Terms & Conditions
                </label>

            </div>

            <button type="submit">
                Register Now
            </button>

            <p class="login-text">

                Already have a vendor account?

                <a href="{% url 'vendors:login' %}">
                    Login
                </a>

            </p>

        </form>

    </div>

</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
