{% extends 'dashboard_base.html' %}
{% block title %}{% endblock%}
{% load static %}
{% block css %}<link rel="stylesheet" href="{% static 'css/myprofile.css' %}" />{% endblock css %} 
{% block main_content %}

        <!-- Right Side Content -->
         <div class="myprofile-container">
                <div class="card-header bg-white">
                    <h4>👤 My Profile</h4>
                </div>

                <div class="card-body">

                    <div class="row">

                        <div class="col-md-6 mb-3">
                            <label class="form-label">First Name</label>
                            <input type="text" class="form-control" value="Akash">
                        </div>

                        <div class="col-md-6 mb-3">
                            <label class="form-label">Last Name</label>
                            <input type="text" class="form-control" value="Mahato">
                        </div>

                        <div class="col-md-6 mb-3">
                            <label class="form-label">Email</label>
                            <input type="email" class="form-control" value="akash@gmail.com">
                        </div>

                        <div class="col-md-6 mb-3">
                            <label class="form-label">Mobile Number</label>
                            <input type="text" class="form-control" value="+91 9876543210">
                        </div>

                        <div class="col-md-12 mb-3">
                            <label class="form-label">Address</label>
                            <textarea class="form-control" rows="3">Jamshedpur, Jharkhand</textarea>
                        </div>

                    </div>

                    <button class="btn btn-primary">
                        Save Changes
                    </button>

                </div>

            </div>

        </div>

    </div>
</div>

{% endblock %}
